<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipies form</title>
</head>
<body>
    
    <section>
        <h1>Recipies form</h1>
        <p>Please fill out the form below to submit your recipies.</p>
        <form action="/submit" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>

            <label for="fileupload">Upload your recipie:</label>
            <input type="file" id="fileupload" name="fileupload" accept=".txt,.pdf,.doc,.docx" required><br><br>

            <label for="comments">Comments:</label><br>
            <textarea id="comments" name="comments" rows="4" cols="50"></textarea><br><br>
            <button type="submit">Submit</button>
        </form>
        <a href="index.html">Back to home</a>
    </section>
</body>
</html>
